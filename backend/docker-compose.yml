version: '3.8'

services:
  # Tor Onionize Service - Creates .onion addresses automatically
  onionize:
    container_name: anonpress-onionize
    image: torservers/onionize
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - onion_services:/var/lib/tor/onion_services:z
    networks:
      - anonpress
    restart: unless-stopped

  # Backend API with Tor support
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonpress-backend
    depends_on:
      onionize:
        condition: service_started
    env_file:
      - .env
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY}
      PINATA_JWT: ${PINATA_JWT}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-https://gateway.pinata.cloud/ipfs}
      TOR_PROXY_HOST: ${TOR_PROXY_HOST:-localhost}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT:-9050}
      TOR_CONTROL_PORT: ${TOR_CONTROL_PORT:-9051}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET}
      ONIONSERVICE_NAME: anonpress-backend
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - /app/node_modules
      - onion_services:/var/lib/tor/onion_services:ro
    networks:
      - anonpress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WordPress with MySQL (Optional - for WordPress plugin testing)
  wordpress-db:
    image: mysql:8.0
    container_name: anonpress-wordpress-db
    environment:
      MYSQL_ROOT_PASSWORD: wordpress_root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - wordpress_db:/var/lib/mysql
    networks:
      - anonpress
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - wordpress

  wordpress:
    image: wordpress:latest
    container_name: anonpress-wordpress
    depends_on:
      wordpress-db:
        condition: service_healthy
      onionize:
        condition: service_started
    environment:
      ONIONSERVICE_NAME: anonpress-wordpress
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "8080:80"
    volumes:
      - wordpress_data:/var/www/html
      - ../wordpress-plugin:/var/www/html/wp-content/plugins/anonpress
    networks:
      - anonpress
    restart: unless-stopped
    profiles:
      - wordpress

networks:
  anonpress:
    driver: bridge

volumes:
  onion_services:
  wordpress_db:
  wordpress_data:
