name: PressProtocol CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-web:
    name: Validate Web Portal (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - name: Setup Node.js (v22.23.3 LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm --filter "@pressprotocol/*" run build

      - name: Typecheck Web Portal
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Build Web Portal
        run: pnpm --dir apps/web build
        env:
          NEXT_PUBLIC_BACKEND_API_URL: "https://api.pressprotocol.com"
          NEXT_PUBLIC_APP_URL: "https://pressprotocol.com"
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}


  validate-node:
    name: Validate P2P Core Node (core/node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - name: Setup Node.js (v22.23.3 LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm --filter "@pressprotocol/*" run build

      - name: Typecheck & Build Node
        run: pnpm --dir core/node build

  subsystem-tests:
    name: Run Automated Subsystem Verification (15 Suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - name: Setup Node.js (v22.23.3 LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: |
          pnpm --filter "@pressprotocol/*" run build
          pnpm --dir core/node build
          pnpm --dir integrations/browser-extension build

      - name: Run Test Harness
        run: bash scripts/test.sh

