name: PressProtocol CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-web:
    name: Validate Web Portal (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm --filter "@pressprotocol/*" run build

      - name: Typecheck Web Portal
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Build Web Portal
        run: pnpm --dir apps/web build
        env:
          NEXT_PUBLIC_BACKEND_API_URL: "https://api.pressprotocol.com"
          NEXT_PUBLIC_APP_URL: "https://pressprotocol.com"
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}


  validate-node:
    name: Validate P2P Core Node (core/node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm --filter "@pressprotocol/*" run build

      - name: Typecheck & Build Node
        run: pnpm --dir core/node build

  subsystem-tests:
    name: Run Automated Subsystem Verification (14 Suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: |
          pnpm --filter "@pressprotocol/*" run build
          pnpm --dir core/node build
          pnpm --dir integrations/browser-extension build

      - name: Run Test Harness
        run: bash scripts/test.sh

