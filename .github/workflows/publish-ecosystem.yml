name: Publish Multi-Language Ecosystem & Registries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish TypeScript Packages to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (v22.23.3 LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm --filter "@pressprotocol/*" run build

      - name: Publish to NPM
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret not configured; cannot publish."
            exit 1
          fi
          for pkg in sdk proof widget; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "@pressprotocol/$pkg@$version" version >/dev/null 2>&1; then
              echo "Skipping @pressprotocol/$pkg@$version — already published."
            else
              pnpm --filter "@pressprotocol/$pkg" publish --access public --no-git-checks
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Wheel & Tarball
        run: python -m build sdks/python

      - name: Publish to PyPI
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::PYPI_TOKEN secret not configured in repository secrets; cannot publish."
            exit 1
          fi
          python -m twine upload sdks/python/dist/* -u __token__ -p "$PYPI_TOKEN" --skip-existing
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-crates-io:
    name: Publish Rust SDK to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Publish to Crates.io
        run: |
          if [ -z "$CRATES_IO_TOKEN" ]; then
            echo "::error::CRATES_IO_TOKEN secret not configured in repository secrets; cannot publish."
            exit 1
          fi
          version=$(grep '^version' sdks/rust/Cargo.toml | head -1 | cut -d'"' -f2)
          if cargo search pressprotocol-rs --limit 1 2>/dev/null | grep -q "\"$version\""; then
            echo "Skipping pressprotocol-rs@$version — already published."
          else
            cargo publish --manifest-path sdks/rust/Cargo.toml --token "$CRATES_IO_TOKEN"
          fi
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  package-and-release:
    name: Create GitHub Release & Package Integrations
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-pypi, publish-crates-io]
    if: always() && !cancelled()
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - name: Package Browser Extension
        run: |
          cd integrations/browser-extension
          pnpm install --frozen-lockfile
          zip -r ../../PressProtocol_Browser_Extension.zip . -x "node_modules/*" ".git/*"
          cd ../..

      - name: Package WordPress Plugin
        run: |
          cd integrations/wordpress-plugin
          zip -r ../../PressProtocol_Wordpress_Plugin.zip . -x ".git/*"
          cd ../..

      - name: Create GitHub Release (via GitHub CLI)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            PressProtocol_Browser_Extension.zip \
            PressProtocol_Wordpress_Plugin.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes

  publish-ghcr:
    name: Publish Sovereign Node to GitHub Packages (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Node Daemon Version
        id: node_version
        run: echo "version=$(node -p "require('./core/node/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: core/node
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pressprotocol-node:latest
            ghcr.io/${{ github.repository_owner }}/pressprotocol-node:v${{ steps.node_version.outputs.version }}
