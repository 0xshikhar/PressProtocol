name: Package Ecosystem Integrations

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-integrations:
    name: Package Integrations (.zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - name: Package Browser Extension
        run: |
          cd integrations/browser-extension
          pnpm install --frozen-lockfile
          zip -r ../../PressProtocol_Browser_Extension.zip . -x "node_modules/*" ".git/*"

      - name: Package WordPress Plugin
        run: |
          cd integrations/wordpress-plugin
          zip -r ../../PressProtocol_Wordpress_Plugin.zip . -x ".git/*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pressprotocol-release-integrations
          path: |
            PressProtocol_Browser_Extension.zip
            PressProtocol_Wordpress_Plugin.zip
