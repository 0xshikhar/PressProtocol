[package]
name = "pressprotocol-rs"
version = "1.0.7"
edition = "2021"
description = "Official PressProtocol Rust SDK - Sovereign Publishing & Deterministic Multihash"
license = "MIT"
authors = ["PressProtocol Architects <hello@pressprotocol.com>"]
repository = "https://github.com/0xshikhar/PressProtocol"
homepage = "https://pressprotocol.com"
documentation = "https://docs.rs/pressprotocol-rs"
readme = "README.md"
keywords = ["pressprotocol", "sovereign", "publishing", "ipfs", "tor"]
categories = ["web-programming::http-client", "cryptography"]


[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

