[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pressprotocol-py"
version = "1.0.7"
description = "Official PressProtocol Python SDK - Sovereign Publishing & Multi-Transport Resolution"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "PressProtocol Architects", email = "hello@pressprotocol.com" }]
keywords = ["pressprotocol", "sovereign", "publishing", "ipfs", "tor", "ed25519", "multihash"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://pressprotocol.com"
Documentation = "https://pressprotocol.com/docs"
Repository = "https://github.com/0xshikhar/PressProtocol"
Issues = "https://github.com/0xshikhar/PressProtocol/issues"


